name: CI
on:
  pull_request:
  push:
    branches: [develop]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: algaguard
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: device
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algaguard -d device"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://algaguard:integration-only@localhost:5432/device
      TEST_DATABASE_URL: postgresql://algaguard:integration-only@localhost:5432/device
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlgaGuard/algaguard-contracts
          ref: develop
          path: algaguard-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          CONTRACTS_DIR: algaguard-contracts
      - run: npm run migrate
      - run: npm run test:integration
      - run: npm audit --audit-level=high
      - run: docker build -t algaguard-device-service:ci .
  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/algaguard/algaguard-device-service:${{ github.sha }}
